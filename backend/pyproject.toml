[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default is the documented pattern, not a bug
    "UP042", # str+Enum kept for JSON-serialisable enum values, consistent with app/models.py
    "UP017", # datetime.timezone.utc kept for readability over the UTC alias
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
