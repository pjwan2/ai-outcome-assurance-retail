# Local developer convenience — NOT the real quality gate. Hooks here can be
# skipped (`git commit --no-verify`) or simply not installed; the actual gate
# is GitHub Actions CI (.github/workflows/ci.yml) plus branch protection on
# `master` requiring it to pass before a PR can merge. Install locally with:
#   pip install pre-commit && pre-commit install
# Run once against the whole repo (useful right after adding this file):
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: mixed-line-ending

  # ruff/mypy run via `language: system` (the already-installed backend venv,
  # not pre-commit's own isolated environment) so results exactly match
  # `make lint`/`make typecheck` and CI — an isolated mypy environment
  # without this repo's actual dependencies installed can report different
  # (usually spurious) errors than running it for real.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && python -m ruff check app tests loadtest'
        language: system
        files: ^backend/(app|tests|loadtest)/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && python -m mypy app'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
