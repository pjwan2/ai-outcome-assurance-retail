name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m ruff check app tests loadtest
      - run: python -m mypy app
      - run: python -m pytest -q
      - run: python scripts/demo_smoke.py
      - run: python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # --audit-level=high already ignores the one known moderate finding
      # (esbuild/vite, no non-breaking fix as of this writing — see
      # docs/security.md); no continue-on-error here, so a real future
      # high/critical finding fails the build instead of being silently passed.
      - run: npm audit --audit-level=high
